<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Plugin Studies</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 98vw; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #222; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #666; margin-top: 0; margin-bottom: 20px; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: .85rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
  th { background: #f0f0f0; font-weight: 600; white-space: nowrap; }
  tr:hover td { background: #f5f5f5; }
  a { color: #0366d6; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .stars { font-size: .8rem; color: #888; white-space: nowrap; }
  .tag { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 10px; background: #e8e8e8; color: #555; margin-right: 4px; }
  .rec { font-size: .8rem; }
  .ver { font-size: .75rem; color: #888; }
  td strong { color: #111; }
  td em { color: #555; font-style: italic; }
  td ul, td ol { margin: 0; padding-left: 16px; }
  td li { margin-bottom: 2px; }
  .count { font-size: .8rem; color: #888; margin-bottom: 10px; }
  @media (max-width: 768px) {
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6) { display: none; }
  }
</style>
</head>
<body>

<h1>Plugin Studies</h1>
<p class="subtitle">Tabela colaborativa de plugins opencode — explicando o que cada um faz.</p>

<p class="count" id="count"></p>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Repo</th>
      <th>Foco Principal</th>
      <th>O que é</th>
      <th>O que faz</th>
      <th>Notas</th>
      <th>Recomendação</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script src="plugin-studies.js"></script>
<script>
(function() {
  const data = window.pluginStudies || [];
  const tbody = document.getElementById('table-body');
  const count = document.getElementById('count');

  count.textContent = data.length + ' repos analisados';

  tbody.innerHTML = data.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td><a href="${r.url}" target="_blank">${r.name}</a><br><span class="ver">${r.version || '—'}</span> <span class="stars">⭐${(r.stars || 0).toLocaleString()}</span></td>
    <td>${r.focus || ''}</td>
    <td>${r.whatIs}</td>
    <td>${r.whatDoes}</td>
    <td>${r.notes || ''}</td>
    <td class="rec">${r.recommendation || ''}</td>
  </tr>`).join('');
})();
</script>

</body>
</html>
