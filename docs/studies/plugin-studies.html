<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Plugin Studies</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #d47616;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 98vw; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text2); margin-top: 0; margin-bottom: 20px; font-size: .95rem; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .count { font-size: .85rem; color: var(--text2); margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; box-shadow: 0 1px 3px rgba(0,0,0,.3); font-size: .82rem; }
  th, td { text-align: left; padding: 10px 12px; border: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface); font-weight: 600; white-space: nowrap; color: var(--text); position: sticky; top: 0; z-index: 2; }
  tr:hover td { background: var(--surface2); }
  td { background: var(--surface); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .stars { font-size: .8rem; color: var(--yellow); white-space: nowrap; }
  .tag { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 10px; background: #1a2a3a; color: var(--accent); margin-right: 4px; }
  .rec { font-size: .8rem; }
  .ver { font-size: .75rem; color: var(--text2); }
  .studied { font-size: .75rem; color: var(--text2); white-space: nowrap; }
  td strong { color: var(--text); }
  td em { color: var(--text2); font-style: italic; }
  td ul, td ol { margin: 0; padding-left: 16px; }
  td li { margin-bottom: 2px; }
  table td:nth-child(1) { text-align: center; color: var(--text2); }
  table td:nth-child(2) { min-width: 160px; }
  table td:nth-child(3) { min-width: 140px; }
  table th:nth-child(1) { width: 30px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: .7rem; font-weight: 600; }
  .badge-yes { background: #1a3a2a; color: var(--green); }
  .badge-no { background: #3a1a1a; color: var(--red); }
  .badge-maybe { background: #3a3a1a; color: var(--yellow); }
  .scroll-wrap { overflow-x: auto; }
  @media (max-width: 768px) {
    table { font-size: .72rem; }
    th, td { padding: 6px 8px; }
    table th:nth-child(4),
    table td:nth-child(4),
    table th:nth-child(5),
    table td:nth-child(5),
    table th:nth-child(6),
    table td:nth-child(6) { display: none; }
  }
</style>
</head>
<body>
<div class="container">

<h1>🧠 <span>Plugin Studies</span></h1>
<p class="subtitle">Tabela colaborativa de plugins opencode — explicando o que cada um faz.</p>

<p class="count" id="count"></p>

<div class="scroll-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Repo</th>
      <th>Foco Principal</th>
      <th>O que é</th>
      <th>O que faz</th>
      <th>Notas</th>
      <th>Estudado em</th>
      <th>Recomendação</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>
</div>

<script src="plugin-studies.js"></script>
<script>
(function() {
  const data = window.pluginStudies || [];
  const tbody = document.getElementById('table-body');
  const count = document.getElementById('count');

  count.textContent = data.length + ' repos analisados';

  function fmt(s) {
    if (!s || s === '\u2014') return '<span class="badge badge-no">\u2014</span>';
    const m = s.match(/^(\u2014)\s*\((.+)\)$/);
    if (m) return '<span class="badge badge-no">\u2014</span> <span style="color:var(--text2);font-size:.75rem">(' + m[2] + ')</span>';
    const m2 = s.match(/^(.+?)\s*\((\d{4}-\d{2}-\d{2})\)$/);
    if (m2) {
      let ver = m2[1].replace(/^v/i, '');
      return '<span class="badge badge-yes">' + ver + '</span> <span style="color:var(--text2);font-size:.75rem">(' + m2[2] + ')</span>';
    }
    return s;
  }

  tbody.innerHTML = data.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td><a href="${r.url}" target="_blank">${r.name}</a><br><span class="ver">${r.version || '\u2014'}</span> <span class="stars">\u2B50${(r.stars || 0).toLocaleString()}</span></td>
    <td>${r.focus || ''}</td>
    <td>${r.whatIs}</td>
    <td>${r.whatDoes}</td>
    <td>${r.notes || ''}</td>
    <td class="studied">${fmt(r.studiedAt)}</td>
    <td class="rec">${r.recommendation || ''}</td>
  </tr>`).join('');
})();
</script>

</div>
</body>
</html>
